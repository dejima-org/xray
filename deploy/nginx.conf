# Directives for the xray.dejima.page server block, inside whatever TLS
# setup the host already uses. `root` follows the `current` symlink per
# request, so a deploy takes effect without reloading nginx.
root /srv/www/xray.dejima.page/current;
index index.html;

location / {
    try_files $uri $uri/ =404;
}

# Fonts and brand images change rarely, but their names don't change with
# them, so they're cached for a week rather than marked immutable.
location /assets/ {
    expires 7d;
}
